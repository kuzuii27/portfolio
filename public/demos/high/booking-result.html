<template id="level-checklist">
  <h3>On this site</h3>
  <ul>
    <li>7 pages, including online booking and a result page</li>
    <li>Booking flow: service, date, time, details, then a ₱500 deposit through Maya (sandbox, test money)</li>
    <li>FAQ chatbot that answers common questions and hands anything else to staff</li>
    <li>Star-rated reviews and a before/after slider</li>
    <li>Custom design, smooth scroll animations, dark and light mode</li>
  </ul>
  <h3>Behind the scenes</h3>
  <ul>
    <li>Fast loading scores and security headers</li>
    <li>Admin panel (CMS) so the clinic can edit prices and pages</li>
    <li>Integrations: booking calendar, Maya payments, Viber or email alerts for staff</li>
    <li>On a real site, Maya confirms each payment to the server (webhook) before the booking is saved. This demo skips that step and saves nothing.</li>
  </ul>
  <h3>In the full application</h3>
  <ul>
    <li>Everything in Standard</li>
    <li>Booking calendar in the admin portal: confirm, move or cancel visits, block dates</li>
    <li>Online deposits with Maya, confirmed automatically by webhook</li>
    <li>Customer list and booking history</li>
    <li>Staff logins with roles (owner, front desk, dentist)</li>
    <li>Chatbot answers you can edit, plus an inbox for handed-off questions</li>
    <li>Email or Viber alerts for new bookings and messages</li>
    <li>Reports, speed tuning and security hardening</li>
  </ul>
</template>
